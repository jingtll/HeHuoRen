<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#27644b" />
    <title>禾伙人 · 学生端样式 Demo</title>
    <style>
      :root {
        --green: #27644b;
        --green-dark: #183e30;
        --green-soft: #eaf2e9;
        --ink: #243d32;
        --muted: #7b867e;
        --paper: #f7f8f4;
        --white: #fff;
        --line: #e7ebe3;
        --yellow: #e9bd56;
        --yellow-soft: #fff4d9;
        --red: #b85a49;
        --radius: 18px;
        --font:
          "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
        --serif: "Noto Serif CJK SC", "Songti SC", "SimSun", serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font: 14px/1.65 var(--font);
        min-width: 320px;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button,
      a,
      input,
      select,
      textarea {
        -webkit-tap-highlight-color: transparent;
      }
      button {
        cursor: pointer;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button {
        color: inherit;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 3px solid #d7af55;
        outline-offset: 3px;
      }
      button {
        border: 0;
        background: none;
      }
      svg.icon {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 30px;
        letter-spacing: -1px;
        line-height: 1.4;
      }
      h2 {
        font-size: 20px;
        line-height: 1.5;
      }
      h3 {
        font-size: 17px;
        line-height: 1.55;
      }
      small {
        font-size: 12px;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 12px;
      }
      .eyebrow {
        font:
          11px/1.5 Georgia,
          serif;
        letter-spacing: 2px;
        color: var(--green);
        margin-bottom: 7px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .between {
        justify-content: space-between;
      }
      .stack {
        display: grid;
        gap: 18px;
      }
      .hidden {
        display: none !important;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px 18px;
        border-radius: 9px;
        background: var(--green);
        color: white;
        font-size: 13px;
        font-weight: 600;
        min-height: 42px;
        transition:
          background 0.18s,
          transform 0.18s;
      }
      .btn:hover {
        background: var(--green-dark);
        transform: translateY(-1px);
      }
      .btn.secondary {
        background: white;
        color: var(--green);
        border: 1px solid var(--line);
      }
      .btn.secondary:hover {
        background: var(--green-soft);
      }
      .btn.soft {
        background: var(--green-soft);
        color: var(--green);
      }
      .btn.danger {
        background: #faeee9;
        color: var(--red);
      }
      .text-btn {
        color: var(--green);
        font-size: 12px;
        display: inline-flex;
        gap: 6px;
        align-items: center;
        padding: 6px 0;
      }
      .text-btn:hover {
        text-decoration: underline;
      }
      .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 38px;
        height: 38px;
        border-radius: 10px;
        position: relative;
      }
      .icon-btn:hover {
        background: var(--green-soft);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        border-radius: 5px;
        padding: 3px 8px;
        background: var(--green-soft);
        color: var(--green);
        white-space: nowrap;
      }
      .badge.gold {
        background: var(--yellow-soft);
        color: #947127;
      }
      .badge.gray {
        background: #eef0ec;
        color: #7c847d;
      }
      .badge.red {
        background: #faeae4;
        color: var(--red);
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }
      .panel {
        border: 1px solid var(--line);
        background: white;
        border-radius: var(--radius);
        padding: 22px;
      }
      .avatar {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: #e6eddd;
        color: #536746;
        font-size: 12px;
        font-weight: 700;
        flex-shrink: 0;
      }
      .avatar.gold {
        background: #f2e7ca;
        color: #876739;
      }
      .avatar.blue {
        background: #e1ebec;
        color: #547477;
      }
      .avatar.big {
        width: 70px;
        height: 70px;
        font-size: 24px;
      }
      .avatar-group {
        display: flex;
        padding-left: 0;
      }
      .avatar-group .avatar {
        width: 28px;
        height: 28px;
        font-size: 10px;
        border: 2px solid white;
        margin-left: -6px;
      }
      .avatar-group .avatar:first-child {
        margin-left: 0;
      }
      .tag {
        display: inline-block;
        padding: 4px 9px;
        background: #f4f5f1;
        border-radius: 5px;
        color: #738071;
        font-size: 11px;
      }
      .tags {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .empty {
        text-align: center;
        padding: 55px 20px;
        border: 1px dashed #d5dfd2;
        border-radius: 16px;
        background: #fcfdf9;
      }
      .empty .icon {
        width: 35px;
        height: 35px;
        color: #92a78f;
        margin-bottom: 10px;
      }
      .empty p {
        color: var(--muted);
        margin: 10px 0 20px;
      }
      .input,
      select,
      textarea {
        width: 100%;
        border: 1px solid #dfe5da;
        border-radius: 9px;
        background: white;
        color: var(--ink);
        padding: 11px 12px;
        min-height: 44px;
      }
      .input:focus,
      select:focus,
      textarea:focus {
        outline: 2px solid #a7bda4;
        outline-offset: 1px;
      }
      textarea {
        resize: vertical;
        min-height: 110px;
      }
      .form-field {
        display: grid;
        gap: 7px;
        font-size: 13px;
      }
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }
      .form-field.full {
        grid-column: 1/-1;
      }
      .form-field small {
        color: var(--muted);
      }
      .check {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        font-size: 12px;
        color: var(--muted);
      }
      .check input {
        accent-color: var(--green);
        margin-top: 5px;
      }
      .notice {
        padding: 12px 15px;
        background: #f4f7ee;
        border-radius: 9px;
        color: #75806b;
        font-size: 12px;
        border-left: 3px solid #bdcda8;
      }
      .notice.gold {
        background: #fffaeb;
        border-left-color: #e6c478;
        color: #927648;
      }
      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: 218px;
        background: #fff;
        border-right: 1px solid var(--line);
        z-index: 20;
        padding: 30px 20px;
        display: flex;
        flex-direction: column;
      }
      .brand {
        display: flex;
        gap: 11px;
        align-items: center;
        padding: 0 9px;
      }
      .brand-mark {
        width: 39px;
        height: 43px;
        color: var(--green);
      }
      .brand-name {
        font-family: var(--serif);
        font-size: 26px;
        letter-spacing: 3px;
        font-weight: 700;
        line-height: 1.3;
      }
      .brand small {
        font-size: 9px;
        letter-spacing: 2px;
        color: #8b9685;
      }
      .school-label {
        margin: 30px 8px 22px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 9px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        color: #758370;
      }
      .school-label .icon {
        width: 17px;
      }
      .nav-label {
        font-size: 10px;
        letter-spacing: 2px;
        color: #a0a99e;
        margin: 18px 14px 8px;
      }
      .nav-link {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        border-radius: 9px;
        margin-bottom: 5px;
        font-size: 13px;
        color: #7e887c;
        transition:
          background 0.2s,
          color 0.2s;
      }
      .nav-link:hover {
        background: #f6f8f2;
        color: var(--green);
      }
      .nav-link.active {
        background: #eaf2e5;
        color: var(--green);
        font-weight: 600;
      }
      .nav-link .count {
        margin-left: auto;
        font-size: 10px;
        background: #d5e5ce;
        border-radius: 5px;
        padding: 0 5px;
      }
      .sidebar-bottom {
        margin-top: auto;
        padding: 18px 8px 0;
      }
      .seed-note {
        padding: 16px;
        background: #f6f7ef;
        border-radius: 12px;
        color: #849078;
        font-size: 11px;
      }
      .seed-note svg {
        width: 24px;
        height: 24px;
        color: #8d9d73;
        margin-bottom: 8px;
      }
      .seed-note strong {
        display: block;
        color: #64775b;
        font-weight: 500;
      }
      .sidebar-bottom .text-btn {
        font-size: 11px;
      }
      .layout {
        margin-left: 218px;
      }
      .topbar {
        height: 82px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 42px;
        background: rgba(247, 248, 244, 0.96);
        gap: 20px;
      }
      .breadcrumb {
        font-size: 12px;
        color: #939b90;
        white-space: nowrap;
      }
      .breadcrumb b {
        color: #596b58;
        font-weight: 500;
      }
      .top-actions {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .search-top {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 13px;
        background: #eeefe9;
        border-radius: 8px;
        width: 255px;
      }
      .search-top .icon {
        width: 17px;
        color: #929d8b;
      }
      .search-top input {
        border: 0;
        outline: 0;
        background: transparent;
        width: 100%;
        font-size: 12px;
        color: var(--ink);
      }
      .notification-dot {
        position: absolute;
        width: 5px;
        height: 5px;
        background: #dcb75f;
        right: 9px;
        top: 8px;
        border: 1px solid var(--paper);
        border-radius: 50%;
      }
      .top-user {
        display: flex;
        gap: 9px;
        align-items: center;
        font-size: 12px;
      }
      .mobile-brand {
        display: none;
      }
      .main {
        padding: 31px 42px 24px;
        max-width: 1440px;
        margin: auto;
      }
      .page-heading {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        align-items: flex-end;
        margin-bottom: 24px;
      }
      .page-heading p {
        font-size: 12px;
        color: var(--muted);
        margin-top: 8px;
      }
      .page-heading .btn {
        flex-shrink: 0;
      }
      .edition {
        font-size: 11px;
        color: #869178;
      }
      .hero {
        display: flex;
        position: relative;
        overflow: hidden;
        background: #e8efdf;
        border: 1px solid #e0e8d6;
        border-radius: 20px;
        min-height: 237px;
        margin-bottom: 30px;
      }
      .hero-copy {
        padding: 34px 37px;
        z-index: 1;
        width: 58%;
      }
      .hero .eyebrow {
        font-size: 10px;
        color: #79916a;
        letter-spacing: 2.5px;
      }
      .hero h2 {
        font-family: var(--serif);
        font-size: 37px;
        font-weight: 500;
        line-height: 1.45;
        letter-spacing: 1px;
        margin: 9px 0 10px;
      }
      .hero p {
        color: #7a896f;
        font-size: 12px;
        margin-bottom: 20px;
        max-width: 350px;
      }
      .hero .btn {
        padding: 9px 16px;
        min-height: 39px;
      }
      .hero-art {
        position: absolute;
        right: 0;
        top: 0;
        bottom: 0;
        width: 46%;
      }
      .hero-art svg {
        width: 100%;
        height: 100%;
      }
      .hero-label {
        position: absolute;
        right: 30px;
        bottom: 18px;
        color: #78906b;
        font-size: 9px;
        letter-spacing: 2px;
      }
      .two-col {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 270px;
        gap: 26px;
      }
      .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 17px;
      }
      .section-title h2 {
        font-size: 19px;
      }
      .section-title h2 small {
        font-weight: 400;
        font-size: 11px;
        margin-left: 10px;
        color: #96a08e;
      }
      .chips {
        display: flex;
        gap: 8px;
        overflow: auto;
        padding-bottom: 4px;
        margin-bottom: 17px;
        scrollbar-width: none;
      }
      .chip {
        padding: 7px 14px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: white;
        color: #85907d;
        font-size: 12px;
        white-space: nowrap;
      }
      .chip.active {
        background: var(--green);
        color: white;
        border-color: var(--green);
      }
      .chip span {
        margin-left: 6px;
        font-size: 10px;
        opacity: 0.65;
      }
      .filterbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 0 16px;
        margin-bottom: 3px;
        flex-wrap: wrap;
      }
      .filterbar select {
        font-size: 11px;
        padding: 7px 23px 7px 10px;
        min-height: 34px;
        width: auto;
        max-width: 200px;
        background: #f7f8f4;
        border-color: #e2e7dc;
      }
      .filterbar .filter-label {
        font-size: 11px;
        color: #95a08c;
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .filterbar .filter-label svg {
        width: 15px;
      }
      .filterbar .result-count {
        font-size: 10px;
        color: #9aa18f;
        margin-left: auto;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 17px;
      }
      .competition-card {
        background: white;
        border: 1px solid var(--line);
        border-radius: 15px;
        overflow: hidden;
        transition:
          box-shadow 0.2s,
          transform 0.2s;
      }
      .competition-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 25px #243d3209;
      }
      .card-art {
        height: 90px;
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 20px;
        background: #edf1e5;
      }
      .card-art.gold {
        background: #f5edda;
      }
      .card-art.blue {
        background: #e7eeee;
      }
      .card-art.pink {
        background: #f1eae1;
      }
      .card-art .art-word {
        font:
          italic 34px/1 Georgia,
          serif;
        opacity: 0.28;
        letter-spacing: -1px;
        z-index: 1;
      }
      .card-art .art-sub {
        font-size: 9px;
        color: #839076;
        letter-spacing: 2px;
        margin-top: 4px;
      }
      .card-art .art-symbol {
        width: 72px;
        height: 72px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.1;
        opacity: 0.55;
        transform: rotate(-10deg);
      }
      .card-art .year {
        position: absolute;
        right: 16px;
        bottom: 10px;
        font:
          9px Georgia,
          serif;
        opacity: 0.4;
      }
      .card-body {
        padding: 19px 20px;
      }
      .card-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }
      .favorite-btn {
        color: #a0a992;
        padding: 4px;
        display: inline-flex;
      }
      .favorite-btn.active {
        color: #b08b3e;
      }
      .favorite-btn.active svg {
        fill: #f0d38b;
      }
      .card-body h3 {
        font-size: 15px;
        line-height: 1.65;
        margin-bottom: 6px;
      }
      .card-body p {
        font-size: 11px;
        color: #8b9586;
        min-height: 18px;
      }
      .card-meta {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 10px;
        color: #8b967f;
        margin: 13px 0 14px;
      }
      .card-meta svg {
        width: 13px;
        height: 13px;
      }
      .card-bottom {
        border-top: 1px solid #edf0e8;
        padding-top: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .card-bottom .text-btn {
        font-size: 11px;
      }
      .card-bottom .icon {
        width: 15px;
        height: 15px;
      }
      .aside-panel {
        background: white;
        border: 1px solid var(--line);
        border-radius: 15px;
        padding: 20px;
      }
      .aside-panel h3 {
        font-size: 14px;
        margin-bottom: 17px;
      }
      .calendar-heading {
        font-size: 10px;
        letter-spacing: 1px;
        color: #9ca58f;
        margin-bottom: 9px;
      }
      .deadline {
        display: flex;
        gap: 13px;
        padding: 13px 0;
        border-bottom: 1px solid #eef1e7;
      }
      .deadline:last-child {
        border-bottom: 0;
        padding-bottom: 0;
      }
      .date-block {
        width: 38px;
        flex-shrink: 0;
        text-align: center;
        border-radius: 7px;
        background: #f4f5ef;
        align-self: flex-start;
        padding: 4px;
      }
      .date-block strong {
        font:
          20px Georgia,
          serif;
        display: block;
        line-height: 1.15;
      }
      .date-block small {
        font-size: 9px;
        color: #95a187;
      }
      .deadline strong {
        font-size: 11px;
        line-height: 1.8;
        display: block;
        font-weight: 500;
      }
      .deadline p {
        font-size: 10px;
        color: #a0a78f;
      }
      .guide {
        background: #f0f2e7;
        border: 1px solid #e6ead9;
      }
      .guide h3 {
        font-family: var(--serif);
        font-weight: 500;
        font-size: 19px;
      }
      .guide p {
        font-size: 11px;
        color: #8b947e;
        line-height: 1.9;
        margin: 9px 0;
      }
      .guide ol {
        list-style: none;
        margin: 18px 0 6px;
        padding: 0;
        display: grid;
        gap: 14px;
      }
      .guide li {
        display: flex;
        gap: 11px;
        font-size: 11px;
        color: #6e7b62;
        align-items: center;
      }
      .guide li span {
        font:
          12px Georgia,
          serif;
        border: 1px solid #cbd4bc;
        width: 24px;
        height: 24px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .mini-profile {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .mini-profile strong {
        font-size: 13px;
      }
      .mini-profile p {
        font-size: 10px;
        color: #99a38e;
      }
      .profile-progress {
        height: 4px;
        background: #edf0e5;
        border-radius: 4px;
        margin: 17px 0 8px;
        overflow: hidden;
      }
      .profile-progress div {
        height: 100%;
        width: 75%;
        background: #9eb285;
      }
      .side-caption {
        font-size: 10px;
        letter-spacing: 1px;
        color: #a4ac98;
        line-height: 2;
        padding: 0 6px;
      }
      .page-footer {
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        color: #a6ad9c;
        border-top: 1px solid var(--line);
        margin-top: 34px;
        padding-top: 17px;
        gap: 15px;
      }
      .page-footer span {
        font-family: Georgia, serif;
        letter-spacing: 1px;
      }
      .team-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }
      .team-card {
        display: flex;
        flex-direction: column;
        border: 1px solid var(--line);

      function render() {
        const hash = location.hash.slice(1),
          parts = hash.split("?");

          ? parts[0]
          : "competitions";
        if (next !== page) {
          activeFilter = "全部";
          query = "";
          scopeFilter = "";
          hostFilter = "";
          roleFilter = "";
          modeFilter = "";
          timeFilter = "open";
          appFilter = "全部";
        }
        page = next;
        if (page === "competitions" || page === "teams") {
          const params = new URLSearchParams(parts[1] || "");
          activeFilter = params.get("category") || "全部";
          query = params.get("q") || "";
          scopeFilter = params.get("scope") || "";
          hostFilter = params.get("host") || "";
          timeFilter = params.has("time") ? params.get("time") : "open";
          roleFilter = params.get("role") || "";
          modeFilter = params.get("mode") || "";
          const categories =
            page === "competitions"
              ? ["全部", "创新创业", "科技实践", "文化设计"]
              : ["全部", "比赛项目", "课程项目", "大创项目", "学习项目"];
          if (!categories.includes(activeFilter)) activeFilter = "全部";
        }
        $("#breadcrumb-title").textContent = labels[page];
        $$("[data-page]").forEach((el) => {
          el.classList.toggle("active", el.dataset.page === page);
          if (el.dataset.page === page) el.setAttribute("aria-current", "page");
          else el.removeAttribute("aria-current");
        });
        $("#invite-count").textContent = state.applications.filter(
          (a) => a.status === "INVITED",

          "my-teams": renderMyTeams,
          favorites: renderFavorites,
          notifications: renderNotifications,
          profile: renderProfile,

          if (scopeFilter) params.set("scope", scopeFilter);
          if (hostFilter) params.set("host", hostFilter);
          if (timeFilter !== "open") params.set("time", timeFilter);
        }
        if (page === "teams") {
          if (roleFilter) params.set("role", roleFilter);
          if (modeFilter) params.set("mode", modeFilter);

          "#" + page + (params.size ? "?" + params.toString() : ""),

          return confirmAction(
            "移交队长身份？",
            "禾同学将成为队长。你保留成员身份，无法继续处理申请或修改招募。",
            "do-transfer",
            id,
          );
        if (action === "do-transfer") {
          const t = teamById(id);
          if (!t?.owned || t.members < 2) return toast("没有可移交的有效成员");
          t.owned = false;
          t.leader = "禾同学";
          state.leftTeams = state.leftTeams.filter((x) => x !== id);
          state.applications.push({
            id: "a" + Date.now(),
            team: id,
            status: "ACCEPTED",
            role: "项目发起人",
            date: nowDemo,
          });
          return finish("已完成移交，你现在是普通成员");
        }
        if (action === "disband-team")
          return confirmAction(
            "解散这支队伍？",
            "所有成员关系结束，申请与邀请失效。演示数据可通过重置恢复。",
            "do-disband",
            id,
          );
        if (action === "do-disband") {
          const t = teamById(id);
          if (!t?.owned) return;
          t.status = "DISBANDED";
          t.members = 0;
          expireOtherApplications(id);
          if (!state.leftTeams.includes(id)) state.leftTeams.push(id);
          return finish("队伍已解散，成员关系已结束");
        }
        if (action === "read-all") {
          state.inbox.forEach((n) => (n.read = true));
          persist();
          render();
          return toast("全部通知已标记为已读");
        }
        if (action === "read-notification") {
          const n = state.inbox.find((n) => n.id === id);
          if (!n) return;
          n.read = true;
          persist();
          move(n.route);
          return;
        }
        if (action === "report") {
          return openDialog(
            "举报招募 · 演示",
            "<p>举报「" +
              esc(teamById(id)?.title) +
              '」，请说明原因。本 Demo 不向外部提交举报。</p><form id="report-form" data-id="' +
              id +
              '" class="stack" style="margin-top:20px"><label class="form-field">原因<select name="reason"><option>内容失实</option><option>招募已失效</option><option>违规或不当内容</option><option>其他原因</option></select></label><label class="form-field">具体说明<textarea name="message" minlength="5" maxlength="300" required placeholder="填写说明，至少 5 字"></textarea></label><button class="btn" type="submit">提交演示举报</button></form>',
          );
        }
        if (action === "reset")
          return confirmAction(
            "重置演示数据？",
            "收藏、申请、招募和资料将恢复初始示例；只影响本 Demo 的浏览器数据。",
            "do-reset",
            "",
          );
        if (action === "do-reset") {
          state = initialState();
          return finish("演示数据已恢复", "competitions");
        }
        if (action === "login" || action === "register")
          return loginForm(action === "register");
        if (action === "style-toast") return toast("这是轻量操作的反馈样式");
        if (action === "more")
          return openDialog(
            "我的禾伙人",
            '<div class="stack"><a class="btn secondary" href="#favorites" data-action="close">我的收藏</a><a class="btn secondary" href="#notifications" data-action="close">站内通知</a><a class="btn secondary" href="#profile" data-action="close">个人资料</a><button class="btn secondary" data-action="login">登录 / 注册演示</button><a class="text-btn" href="#style" data-action="close">查看样式规范 ↗</a><button class="text-btn" data-action="reset">重置演示数据</button></div>',
          );
        if (action === "simulate-invite") {
          const pending = state.applications.filter(
            (a) => a.status === "PENDING" && teamOpen(teamById(a.team)),
          );
          return openDialog(
            "推进演示 · 模拟队长处理",
            '<p>此处仅用于演示状态变化，正式学生界面没有替其他队长处理申请的权限。</p><div class="stack" style="margin-top:18px">' +
              pending
                .map(
                  (a) =>
                    '<button class="btn secondary" data-action="do-simulate-invite" data-id="' +
                    a.id +
                    '">模拟收到「' +
                    esc(teamById(a.team).title) +
                    "」的邀请</button>",
                )
                .join("") +
              (pending.length
                ? ""
                : "<p>没有待处理且有效的申请，先去招募详情提交一份申请。</p>") +
              "</div>",
          );
        }
        if (action === "do-simulate-invite") {
          const a = state.applications.find((a) => a.id === id),
            t = a && teamById(a.team);
          if (!a || a.status !== "PENDING" || !t || !teamOpen(t))
            return toast("此申请无法生成邀请");
          a.status = "INVITED";
          a.expires = "2026-10-04 18:00";
          addNotice(
            "你收到了一份入队邀请",
            t.leader + "邀请你加入「" + t.title + "」。",
            "applications",
          );
          return finish("已模拟收到邀请，仍需你主动确认");
        }
      });
      document.addEventListener("change", (e) => {
        const map = {
            "scope-filter": "scope",
            "host-filter": "host",
            "time-filter": "time",
            "role-filter": "role",
            "mode-filter": "mode",
          },
          kind = map[e.target.id];
        if (kind) {
          if (kind === "scope") scopeFilter = e.target.value;
          if (kind === "host") hostFilter = e.target.value;
          if (kind === "time") timeFilter = e.target.value;
          if (kind === "role") roleFilter = e.target.value;
          if (kind === "mode") modeFilter = e.target.value;
          updateFilterURL();
        }
        if (e.target.id === "publish-type") updatePublishFields();
        if (e.target.id === "publish-competition") {
          const c = competitionById(e.target.value);
          $("#publish-track").innerHTML = c
            ? c.tracks
                .map(
                  ([n, p]) =>
                    '<option value="' +
                    esc(n) +
                    '">' +
                    esc(n) +
                    " · " +
                    p +
                    "</option>",
                )
                .join("")
            : '<option value="">先选择关联比赛</option>';
        }
      });
      document.addEventListener("submit", (e) => {
        const form = e.target;
        if (
          ![
            "profile-form",
            "apply-form",
            "publish-form",
            "dialog-search",
            "search-form",
            "login-form",
            "report-form",
          ].includes(form.id)
        )
          return;
        e.preventDefault();
        const data = Object.fromEntries(new FormData(form));
        if (form.id === "profile-form") {
          if (
            ["name", "major", "grade", "hours", "skills"].some(
              (k) => !data[k].trim(),
            )
          )
            return toast("请填写有效的资料");
          const oldName = state.profile.name;
          state.profile = {
            ...state.profile,
            ...data,
            share: form.elements.share.checked,
          };
          state.teams
            .filter((t) => t.owned && t.leader === oldName)
            .forEach((t) => (t.leader = data.name));
          return finish(
            storageAvailable
              ? "资料已保存，队友可以更了解你了"
              : "资料已更新，当前浏览器未启用持久保存",
          );
        }
        if (form.id === "apply-form") {
          const t = teamById(form.dataset.id);
          if (!t || !teamOpen(t) || t.owned || currentApplication(t.id))
            return toast("当前无法提交，请重新查看队伍状态");
          if (data.message.trim().length < 10)
            return toast("请填写至少 10 字的有效介绍");
          state.applications.push({
            id: "a" + Date.now(),
            team: t.id,
            status: "PENDING",
            role: data.role,
            message: data.message.trim(),
            date: nowDemo,
          });
          addNotice(
            "申请已提交",
            "已向「" + t.title + "」提交申请，等待队长处理。",
            "applications",
          );
          return finish("申请已提交，等待队长处理", "applications");
        }
        if (form.id === "publish-form") {
          const edit = teamById(form.dataset.edit),
            capacity = Number(data.capacity),
            roles = data.roles
              .split(/[,，]/)
              .map((s) => s.trim())
              .filter(Boolean);
          if (!data.title.trim() || data.summary.trim().length < 15)
            return toast("请填写项目名称与至少 15 字的项目介绍");
          if (!roles.length || roles.length > 6)
            return toast("请填写 1–6 个招募角色");
          if (
            !Number.isInteger(capacity) ||
            capacity < (edit ? edit.members : 2) ||
            capacity > 10
          )
            return toast("人数上限须有效，且不能低于当前有效成员数");
          if (data.date < "2026-10-03")
            return toast("招募截止须晚于固定演示日期");
          let competition = "",
            track = "";
          if (data.type === "比赛项目") {
            const c = competitionById(data.competition),
              tr = c?.tracks.find(([n]) => n === data.track);
            if (!c || c.status !== "open" || !tr)
              return toast("请选择有效的比赛与其赛道");
            const bounds = tr[1].match(/\d+/g).map(Number);
            if (capacity < bounds[0] || capacity > bounds[1])
              return toast(
                "该赛道人数上限应在 " +
                  bounds[0] +
                  "–" +
                  bounds[1] +
                  " 人之间（含队长）",
              );
            competition = c.id;
            track = data.track;
          }
          const values = {
            title: data.title.trim(),
            type: data.type,
            competition,
            track,
            roles,
            summary: data.summary.trim(),
            mode: data.mode,
            hours: data.hours.trim(),
            date: data.date,
            campus: data.campus,
            capacity,
          };
          if (edit) {
            if (!edit.owned) return toast("仅队长可以编辑");
            Object.assign(edit, values);
            if (edit.members >= edit.capacity) edit.status = "PAUSED";
          } else
            state.teams.unshift({
              ...values,
              id: "t" + Date.now(),
              leader: state.profile.name,
              college: state.profile.college,
              members: 1,
              status: "OPEN",
              hidden: false,
              owned: true,
            });
          return finish(
            edit ? "招募信息已更新" : "发布成功，你已成为队长并计入人数",
            "my-teams",
          );
        }
        if (form.id === "dialog-search" || form.id === "search-form") {
          query = (data.q ?? $("#global-search").value).trim();
          closeDialog();
          if (page !== "teams" && page !== "competitions") {
            location.hash = "competitions?q=" + encodeURIComponent(query);
          } else updateFilterURL();
          return;
        }
        if (form.id === "login-form") {
          return finish("已进入林同学演示身份，未创建真实账号", "competitions");
        }
        if (form.id === "report-form") {
          if (data.message.trim().length < 5)
            return toast("请填写至少 5 字的有效说明");
          addNotice(
            "演示举报已记录",
            "关于「" +
              teamById(form.dataset.id)?.title +
              "」的示例举报：" +
              data.reason +
              "。未发送至服务器。",
            "notifications",
          );
          return finish("演示举报已记录；未发送到外部");
        }
      });
      $("#dialog").addEventListener("click", (e) => {
        if (e.target === $("#dialog")) {
          const r = $("#dialog").getBoundingClientRect();
          if (
            e.clientX < r.left ||
            e.clientX > r.right ||
            e.clientY < r.top ||
            e.clientY > r.bottom
          )
            closeDialog();
        }
      });
      window.addEventListener("hashchange", () => {
        closeDialog();
        render();
        window.scrollTo({ top: 0, behavior: "instant" });
      });
      render();
    </script>
  </body>
</html>
